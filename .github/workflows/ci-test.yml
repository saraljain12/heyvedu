name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Pick newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Test
        run: |
          xcodebuild test -project HeyVedu.xcodeproj -scheme HeyVedu -configuration Debug \
            -destination 'platform=macOS' -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO 2>&1 | tee build.log | grep -E "error:|✘|✔ Test|Test run|TEST (SUCCEEDED|FAILED)"
          exit ${PIPESTATUS[0]}
      - name: Package app
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -path "*Build/Products/Debug/HeyVedu Dev.app" -maxdepth 6 | head -1)
          ditto -c -k --keepParent "$app" HeyVedu-Dev.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HeyVedu-Dev
          path: HeyVedu-Dev.zip
